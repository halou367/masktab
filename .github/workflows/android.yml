# 安卓版（GeckoView 内核）的构建与模拟器冒烟测试，见 docs/android.md。
# 两种触发：
#   - main 分支：由 ci.yml 调用（workflow_call），每次推送都跑；通过后 ci.yml 把 APK 和电脑安装程序放进同一个 Release（decisions D-3）。
#     版本号 = 0.1.<ci.yml 的运行序号>，与电脑版相同（被调用时 GITHUB_RUN_NUMBER 是调用方的）。
#   - 其它分支：安卓相关文件有变化时自己运行，只出产物，不发布。
# 产物（Actions → 本次运行 → Artifacts）：
#   MaskTab-android-arm64-v8a：调试签名的 APK，装到手机上用
#   MaskTab-android-x86_64：同上，x86_64 架构（模拟器用）
#   android-smoke：模拟器截图（启动进度、新标签页、头像菜单、实例管理、节点、网页）与 logcat
name: Android
on:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - 'companion/ext/ui.js'
      - 'companion/ext/ui.css'
      - 'companion/ext/sites.js'
      - 'companion/ext/menu.js'
      - 'companion/ext/instances.js'
      - 'companion/ext/autofill.js'
      - 'companion/ext/common.js'
      - 'companion/ext/panel.js'
      - 'companion/ext/panel.css'
      - 'companion/ext/pages.js'
      - 'companion/ext/ntp.js'
      - 'companion/ext/vaultmsg.js'
      - 'companion/ext/assets/flags/**'
      # 核心服务（和电脑版同一份 Go 代码）也打进 APK，决策 D-4
      - 'cmd/masktab/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: 安卓 SDK 组件（GeckoView 160 要 compileSdk 37.2）
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | grep -E "platforms|build-tools" || true
      - name: 下载并校验 mihomo
        run: bash android/scripts/fetch-mihomo.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 编译核心服务（和电脑版同一份代码，NDK 链接）
        run: bash android/scripts/build-core.sh "0.1.${GITHUB_RUN_NUMBER}"
      - name: 检查内置扩展脚本语法
        run: |
          for f in android/ext/*.js companion/ext/menu.js companion/ext/instances.js companion/ext/autofill.js companion/ext/ui.js companion/ext/sites.js companion/ext/common.js companion/ext/panel.js companion/ext/pages.js companion/ext/ntp.js companion/ext/vaultmsg.js; do
            node --check "$f" 2>/dev/null || node --input-type=module --check < "$f" || { echo "语法错误：$f"; exit 1; }
          done
      # 两端一致性检查：同一份核心服务状态，分别画电脑版的工具栏弹窗和手机的页面，节点面板的内容必须一样；
      # 顺带把手机的每一页点一遍（菜单、面板、三个列表、四个标签）。
      - name: 两端界面一致性检查
        run: |
          mkdir -p /tmp/ext /tmp/pw
          cp -r companion/ext/{ui.js,ui.css,sites.js,menu.js,instances.js,autofill.js,common.js,panel.js,panel.css,pages.js,ntp.js,vaultmsg.js,assets} /tmp/ext/
          cp -r android/ext/* /tmp/ext/
          cp android/scripts/preview-pages.mjs android/scripts/fixture-state.json /tmp/pw/
          cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.65.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          node preview-pages.mjs /tmp/ext /tmp/ppout "$GITHUB_WORKSPACE/companion/ext" | grep -v '^[ {}]'
          test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-pages
          path: /tmp/ppout
          if-no-files-found: ignore
      - name: 构建
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: 整理产物
        run: |
          mkdir -p out
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk out/MaskTab-android-arm64-v8a.apk
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk out/MaskTab-android-x86_64.apk
          ls -la out
          unzip -l out/MaskTab-android-arm64-v8a.apk | grep -E "libmihomo|libmasktab|libxul|assets/ext/(manifest|background|fp|panel|pages|common)" || true
          unzip -l out/MaskTab-android-arm64-v8a.apk | grep -q "lib/arm64-v8a/libmasktab.so" || { echo "APK 里没有核心服务"; exit 1; }
          unzip -l out/MaskTab-android-x86_64.apk | grep -q "lib/x86_64/libmasktab.so" || { echo "x86_64 APK 里没有核心服务"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: MaskTab-android-arm64-v8a
          path: out/MaskTab-android-arm64-v8a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MaskTab-android-x86_64
          path: out/MaskTab-android-x86_64.apk
          if-no-files-found: error

  smoke:
    name: 模拟器冒烟测试（x86_64）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MaskTab-android-x86_64
          path: out
      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # 测试脚本跑完后，模拟器关机偶尔卡住（存快照后不退出，run 43493186366 卡了 10 分钟）：
      # 不存快照（-no-snapshot），这一步限时、失败不中断，是否通过由下一步按 shots/result.txt 判定。
      - name: 启动模拟器并测试
        id: emu
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # mihomo 安卓二进制按 API 34 构建（ELF 里写着 for Android 34），模拟器用 35
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 1200 bash android/scripts/emulator-smoke.sh out/MaskTab-android-x86_64.apk shots
      - name: 判定冒烟结果
        run: |
          r=$(cat shots/result.txt 2>/dev/null || echo "没有结果文件")
          echo "测试脚本结果：$r（模拟器这一步：${{ steps.emu.outcome }}）"
          [ "$r" = "0" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: shots
