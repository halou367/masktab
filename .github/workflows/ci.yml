# 每次推送：
#   1. 单元测试（Linux）。
#   2. 在真实的 Windows 机器上构建两个安装程序，把完整包静默安装后对"装好的那一份"跑冒烟测试，
#      再验证覆盖升级（数据与内核不动）与卸载（数据保留）。
#   3. Linux 无头冒烟测试。
#   4. 只在 main 分支：构建安卓版并跑模拟器冒烟测试（调用 android.yml），然后电脑版和安卓版一起发布。
# 两端同步发布（decisions D-3）：一次推送 = 一个版本号 0.1.<本工作流的运行序号> = 一个 Release，
#   里面同时有电脑安装程序和手机 APK；上面四项有一项不过就整个不发，不会出现只发了一端的版本。
# 产物：
#   Releases 页面：MaskTab-Setup-Full.exe（首次安装用，自带浏览器内核与代理内核）、MaskTab-Setup.exe（升级用，几 MB）、
#                  MaskTab-android-arm64-v8a.apk（手机，覆盖安装）。
#   Actions → 本次运行 → Artifacts：同样的安装程序，以及 smoke-windows / smoke-linux / android-smoke（测试结果、日志、截图）。
name: CI
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # 发布安装程序到 Releases

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...

  windows:
    name: 安装程序与冒烟测试（Windows，有界面）
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VER: 0.1.${{ github.run_number }}
    outputs:
      kver: ${{ steps.pack.outputs.KVER }}
      mver: ${{ steps.pack.outputs.MVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建 masktab.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, out | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$env:VER" -o dist/masktab.exe ./cmd/masktab
          Get-Item dist/masktab.exe | Format-List Name, Length
      - name: 缓存浏览器内核与代理内核
        uses: actions/cache@v4
        with:
          path: pack
          key: pack-windows-${{ hashFiles('internal/kernel/fetch.go') }}
      - name: 准备浏览器内核与代理内核（下载、校验、解压）
        id: pack
        shell: pwsh
        run: |
          go run ./cmd/pack -dir pack | Tee-Object pack-info.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content pack-info.txt | Where-Object { $_ -match '^(KVER|MVER)=' } | Add-Content $env:GITHUB_ENV
          Get-Content pack-info.txt | Where-Object { $_ -match '^(KVER|MVER)=' } | Add-Content $env:GITHUB_OUTPUT
      - name: 构建安装程序
        shell: pwsh
        run: |
          # NSIS：旧的 runner 镜像自带；新镜像（windows-2025-vs2026，2026-11 起）没有，而且 choco 装它不稳
          # （运行 43881369841、43885836953 都死在这里）。次序：自带的 → choco（试两次，输出留着）→ 官方便携包（校验 SHA-256）。
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          foreach ($i in 1..2) {
            if (Test-Path $nsis) { break }
            choco install nsis -y --no-progress
            if (-not (Test-Path $nsis)) { Start-Sleep -Seconds 8 }
          }
          if (-not (Test-Path $nsis)) {
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            foreach ($u in @('https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip', 'https://prdownloads.sourceforge.net/nsis/nsis-3.11.zip?download')) {
              curl.exe -sSL --retry 3 --max-time 120 -o $zip $u
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-FileHash $zip -Algorithm SHA256).Hash -eq 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') {
                Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'nsis') -Force
                $nsis = Join-Path $env:RUNNER_TEMP 'nsis\nsis-3.11\makensis.exe'
                break
              }
              Write-Host "便携包下载失败或校验不对：$u"
            }
          }
          if (-not (Test-Path $nsis)) { throw "找不到 makensis" }
          Write-Host "makensis：$nsis"
          $root = (Get-Location).Path
          $kernel = Join-Path $root "pack\kernel\fingerprint-chromium\$env:KVER"
          if (-not (Test-Path $kernel)) { throw "内核目录不存在：$kernel" }
          $common = @('/V2', '/INPUTCHARSET', 'UTF8', "/DVERSION=$env:VER", "/DVERSION4=$env:VER.0", "/DSRC=$root\dist")
          & $nsis @common "/DOUT=$root\out\MaskTab-Setup.exe" installer\masktab.nsi
          if ($LASTEXITCODE -ne 0) { throw "普通安装包构建失败" }
          & $nsis @common "/DOUT=$root\out\MaskTab-Setup-Full.exe" /DFULL "/DKVER=$env:KVER" "/DMVER=$env:MVER" "/DKERNEL=$kernel" "/DMIHOMO=$root\pack\mihomo.exe" installer\masktab.nsi
          if ($LASTEXITCODE -ne 0) { throw "完整安装包构建失败" }
          Get-ChildItem out | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }
      - name: 静默安装完整包
        shell: pwsh
        run: |
          $t = Measure-Command { Start-Process -Wait -FilePath out\MaskTab-Setup-Full.exe -ArgumentList '/S', '/D=C:\mt' }
          "完整包安装用时 {0:n0} 秒" -f $t.TotalSeconds
          foreach ($f in 'masktab.exe', 'mihomo.exe', 'uninstall.exe', "kernel\fingerprint-chromium\$env:KVER\installed.ok") { if (-not (Test-Path "C:\mt\$f")) { throw "安装后缺少 $f" } }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MaskTab.lnk")) { throw "没有创建开始菜单快捷方式" }
      - name: 冒烟测试（对装好的那一份；内核与代理内核都来自安装包，不应再下载）
        run: node scripts/smoke.mjs --bin C:\mt\masktab.exe --data C:\mt\data --shots shots --visible
      - name: 覆盖升级与卸载
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Need($cond, $msg) { if ($cond) { "通过：$msg" } else { throw "失败：$msg" } }
          Need (Test-Path C:\mt\data\config\instances.json) '冒烟测试留下了数据'
          Need (-not (Test-Path C:\mt\data\kernel\fingerprint-chromium)) '没有重新下载内核（用的是安装包里的）'
          Need (-not (Test-Path C:\mt\data\core\mihomo.exe)) '没有重新下载代理内核'
          $mark = (Get-Item "C:\mt\kernel\fingerprint-chromium\$env:KVER\installed.ok").LastWriteTimeUtc
          $data = (Get-FileHash C:\mt\data\config\instances.json).Hash

          # 1) MaskTab 正在运行时用普通包升级：安装程序应当先让它退出，再替换 masktab.exe
          Start-Process -FilePath C:\mt\masktab.exe -ArgumentList '-no-open', '-keep'
          Start-Sleep 6
          Need ((Get-Process masktab -ErrorAction SilentlyContinue) -ne $null) '升级前 MaskTab 在运行'
          Start-Process -Wait -FilePath out\MaskTab-Setup.exe -ArgumentList '/S', '/D=C:\mt'
          Need ((Get-Process masktab -ErrorAction SilentlyContinue) -eq $null) '升级时已让运行中的 MaskTab 退出'
          Need ((Get-FileHash C:\mt\masktab.exe).Hash -eq (Get-FileHash dist\masktab.exe).Hash) 'masktab.exe 已替换为新版本'
          Need ((Get-FileHash C:\mt\data\config\instances.json).Hash -eq $data) '升级没有动数据'
          Need ((Get-Item "C:\mt\kernel\fingerprint-chromium\$env:KVER\installed.ok").LastWriteTimeUtc -eq $mark) '升级没有动浏览器内核'

          # 2) 再装一次完整包：内核与代理内核版本没变，应当跳过（很快）
          $t = Measure-Command { Start-Process -Wait -FilePath out\MaskTab-Setup-Full.exe -ArgumentList '/S', '/D=C:\mt' }
          "完整包覆盖安装用时 {0:n0} 秒" -f $t.TotalSeconds
          Need ((Get-Item "C:\mt\kernel\fingerprint-chromium\$env:KVER\installed.ok").LastWriteTimeUtc -eq $mark) '完整包覆盖安装时跳过了已有的内核'
          Need ((Get-FileHash C:\mt\data\config\instances.json).Hash -eq $data) '完整包覆盖安装没有动数据'

          # 3) 在线更新（决策 N-3）：假的 GitHub 上放着“0.1.99999”，安装包就是刚构建的这个。走真的那条路：
          #    查到新版本 → 下载并校验 → MaskTab 自己运行安装程序、退出 → 安装程序装完把它重新打开 → 更新前开着的实例恢复
          $srv = Start-Process -PassThru -FilePath node -ArgumentList 'scripts\fake-github.mjs', '18090', '0.1.99999', 'MaskTab-Setup.exe', 'out\MaskTab-Setup.exe' -RedirectStandardOutput smoke-out-fakegh.log
          $env:MASKTAB_UPDATE_API = 'http://127.0.0.1:18090'; $env:MASKTAB_UPDATE_WEB = 'http://127.0.0.1:18090'
          Remove-Item C:\mt\uninstall.exe   # 安装程序会重新写出它：用来确认安装程序真的运行过
          Start-Process -FilePath C:\mt\masktab.exe -ArgumentList '-no-open', '-keep'
          Start-Sleep 6
          function Api($m, $p) { $l = (Get-Content C:\mt\data\state\running.lock -Raw).Trim() -split '\s+'; Invoke-RestMethod -Method $m -Uri "http://127.0.0.1:$($l[0])$p" -Headers @{ 'X-MaskTab-Token' = $l[1] } -TimeoutSec 90 }
          function Until($sec, $what) { for ($i = 0; $i -lt $sec; $i++) { try { if (& $what) { return $true } } catch { }; Start-Sleep 1 }; return $false }
          $old = (Get-Process masktab).Id
          # 冒烟测试把自己建的实例都删了：这里新建一个（建好会自动打开），更新之后它应当被开回来
          $l = (Get-Content C:\mt\data\state\running.lock -Raw).Trim() -split '\s+'
          $id = (Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$($l[0])/api/instances" -Headers @{ 'X-MaskTab-Token' = $l[1] } -ContentType 'application/json' -Body '{}' -TimeoutSec 90).id
          Need ($id -and (Until 90 { ((Api GET /api/state).instances | Where-Object { $_.id -eq $id }).rt.running })) '更新前：新建的实例开着'
          $u = Api POST /api/update/check
          "检查结果：当前 $($u.current)，最新 $($u.latest)，available=$($u.available)，install=$($u.install)，size=$($u.size)"
          Need ($u.available -and $u.latest -eq '0.1.99999' -and $u.install -eq 'self') '在线更新：查到新版本，电脑版自己安装'
          Api POST /api/update/download | Out-Null
          Need (Until 90 { (Api GET /api/state).update.phase -eq 'ready' }) '在线更新：安装包下载好并校验通过'
          Api POST /api/update/install | Out-Null
          Need (Until 120 { $p = Get-Process masktab -ErrorAction SilentlyContinue; $p -and ($p.Id -notcontains $old) -and (Test-Path C:\mt\data\state\running.lock) -and (Api GET /api/state).version }) '在线更新：旧进程退出，安装程序装完把 MaskTab 重新打开'
          Need (Test-Path C:\mt\uninstall.exe) '在线更新：安装程序运行过（uninstall.exe 重新写出）'
          Need ((Get-FileHash C:\mt\masktab.exe).Hash -eq (Get-FileHash dist\masktab.exe).Hash) '在线更新：masktab.exe 是安装包里的那一份'
          Need (Until 120 { ((Api GET /api/state).instances | Where-Object { $_.id -eq $id }).rt.running }) '在线更新：更新前开着的实例恢复了'
          Need (-not (Test-Path C:\mt\data\state\restore-once)) '在线更新：“恢复一次”的记号用完就删了'
          if (Test-Path shots) { try { Add-Type -AssemblyName System.Windows.Forms, System.Drawing; $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size); $bmp.Save("$PWD\shots\8-after-online-update.png") } catch { "截图没成：$_" } }
          Start-Process -Wait -FilePath C:\mt\masktab.exe -ArgumentList '-quit'
          Need ((Get-Process masktab -ErrorAction SilentlyContinue) -eq $null) '在线更新后 MaskTab 能正常退出'
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          $env:MASKTAB_UPDATE_API = $null; $env:MASKTAB_UPDATE_WEB = $null

          # 4) 卸载：程序与内核删除，数据保留
          Start-Process -Wait -FilePath C:\mt\uninstall.exe -ArgumentList '/S', '_?=C:\mt'
          Need (-not (Test-Path C:\mt\masktab.exe)) '卸载删除了程序'
          Need (-not (Test-Path C:\mt\kernel)) '卸载删除了内核'
          Need (Test-Path C:\mt\data\config\instances.json) '卸载保留了数据'
      - name: 收集测试结果
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          if (Test-Path smoke-out-fakegh.log) { Move-Item smoke-out-fakegh.log smoke-out\fake-github.log -Force }
          foreach ($f in 'smoke-result.md', 'smoke-core.log', 'state\masktab.log', 'core\mihomo.log') { if (Test-Path "C:\mt\data\$f") { Copy-Item "C:\mt\data\$f" smoke-out\ } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: |
            shots/
            smoke-out/
      - uses: actions/upload-artifact@v4
        with:
          name: MaskTab-Setup
          path: out/MaskTab-Setup.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: MaskTab-Setup-Full
          path: out/MaskTab-Setup-Full.exe
          compression-level: 0

  smoke-linux:
    name: 冒烟测试（Linux，无头）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go build -o masktab ./cmd/masktab
      - name: 缓存内核与 mihomo
        uses: actions/cache@v4
        with:
          path: |
            smoke-data/kernel
            smoke-data/core/mihomo
          key: tools-linux-${{ hashFiles('internal/kernel/fetch.go') }}
      - name: 冒烟测试
        run: node scripts/smoke.mjs --bin ./masktab --data smoke-data --shots shots
      - name: 录入登录与自动填写（真浏览器 + 真核心服务；最后一项把伴随扩展真的装进 Chromium 走一遍）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.65.1 > /dev/null && npx playwright install --with-deps chromium firefox > /dev/null
          node "$GITHUB_WORKSPACE/scripts/rec-test.mjs" "$GITHUB_WORKSPACE/masktab" chromium "$GITHUB_WORKSPACE/shots/rec"
          node "$GITHUB_WORKSPACE/scripts/rec-test.mjs" "$GITHUB_WORKSPACE/masktab" firefox
          # 两遍：有代理内核（实例正常开着，工具栏是“直连”）、没有代理内核（实例不让开，工具栏上写着原因）
          MASKTAB_MIHOMO="$GITHUB_WORKSPACE/smoke-data/core/mihomo" node "$GITHUB_WORKSPACE/scripts/ext-e2e.mjs" "$GITHUB_WORKSPACE/masktab" "$GITHUB_WORKSPACE/shots/ext"
          node "$GITHUB_WORKSPACE/scripts/ext-e2e.mjs" "$GITHUB_WORKSPACE/masktab"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: |
            shots/
            smoke-data/smoke-result.md
            smoke-data/smoke-core.log
            smoke-data/state/masktab.log

  # 安卓版：只在 main 上由这里调用（版本号与电脑版相同）；其它分支由 android.yml 自己按文件变化触发。
  android:
    name: 安卓版
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android.yml

  # 两端一起发布：前面全部通过才发，一个 Release 里同时放电脑安装程序和手机 APK。
  release:
    name: 发布（电脑 + 手机）
    if: github.ref == 'refs/heads/main'
    needs: [test, windows, smoke-linux, android]
    runs-on: ubuntu-latest
    env:
      VER: 0.1.${{ github.run_number }}
      KVER: ${{ needs.windows.outputs.kver }}
      MVER: ${{ needs.windows.outputs.mver }}
    steps:
      # 取代码只为了从提交记录里列出“这一版的改动”（在线更新的界面会显示这一段，决策 N-3）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: MaskTab-Setup-Full
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: MaskTab-Setup
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: MaskTab-android-arm64-v8a
          path: out
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          for f in MaskTab-Setup-Full.exe MaskTab-Setup.exe MaskTab-android-arm64-v8a.apk; do [ -s "out/$f" ] || { echo "缺少 $f"; exit 1; }; done
          # 校验值表：在线更新连不上 GitHub 接口（被限流、被墙）时，从网页这条路取版本号和校验值（internal/update 的 viaWeb）
          (cd out && sha256sum MaskTab-Setup-Full.exe MaskTab-Setup.exe MaskTab-android-arm64-v8a.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # 这一版的改动 = 上一个版本的标签到现在的提交标题（合并提交不算）；写在最前面，用一行 --- 和安装说明隔开（核心服务按这条线截取）
          PREV=$(git tag --list 'v0.1.*' --sort=-v:refname | head -1)
          {
            echo "这一版的改动"
            # 只列用户看得见的改动：标题以“CI：”“文档：”“测试：”开头的提交不列；一条都不剩时写一句
            if [ -n "$PREV" ]; then git log --no-merges --format='- %s' "$PREV..$GITHUB_SHA"; else git log --no-merges --format='- %s' -5 "$GITHUB_SHA"; fi | grep -v -E '^- (CI|文档|测试)：' | head -15 > changes.txt || true
            if [ -s changes.txt ]; then cat changes.txt; else echo "- 内部调整，没有用户看得见的改动"; fi
            echo
            echo "---"
            echo
            echo "电脑（Windows）"
            echo "- 已经装了的：设置 → 组件与更新 里直接更新（电脑、手机都可以）。"
            echo "- 首次安装：下载 MaskTab-Setup-Full.exe（自带浏览器内核 $KVER 与代理内核 $MVER，装完不需要再下载）。"
            echo "- 升级：下载 MaskTab-Setup.exe 直接覆盖安装；数据、内核都不会动。"
            echo
            echo "手机（安卓，arm64）"
            echo "- 下载 MaskTab-android-arm64-v8a.apk 覆盖安装；数据不会动。"
            echo
            echo "两端是同一份代码、同一个版本号 $VER。"
          } > notes.md
          cat notes.md
          gh release create "v$VER" out/MaskTab-Setup-Full.exe out/MaskTab-Setup.exe out/MaskTab-android-arm64-v8a.apk out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MaskTab $VER" --notes-file notes.md
