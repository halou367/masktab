<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>MaskTab</title><link rel="stylesheet" href="ui.css">
<style>
body{display:flex;min-height:100vh} nav{width:64px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0} nav .ib{width:42px;height:42px} nav .ib.on{background:var(--hover)}
main{flex:1;max-width:980px;padding:20px 28px} h2{font-size:18px;font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .item .no{font-weight:600;min-width:34px} .item input.name{border-color:transparent;background:transparent;width:150px} .item input.name:hover,.item input.name:focus{border-color:var(--line)}
.sw{display:flex;gap:3px} .sw button{width:16px;height:16px;border-radius:50%;border:2px solid transparent} .sw button.on{border-color:var(--fg)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace} .full{flex-basis:100%} .set{display:grid;grid-template-columns:28px 220px 1fr;gap:12px 10px;align-items:center;max-width:760px} label.ck{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
</style></head><body><nav id="nav"></nav><main id="main"></main><script type="module" src="app.js"></script></body></html>
