<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>MaskTab</title><link rel="stylesheet" href="ui.css">
<style>
body{display:flex;min-height:100vh} nav{width:64px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0} nav .ib{width:42px;height:42px} nav .ib.on{background:var(--hover)}
main{flex:1;max-width:1280px;padding:20px 28px} h2{font-size:18px;font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .item .no{font-weight:600;min-width:34px} .item input.name{border-color:transparent;background:transparent;width:150px} .item input.name:hover,.item input.name:focus{border-color:var(--line)}
.sw{display:flex;gap:3px} .sw button{width:16px;height:16px;border-radius:50%;border:2px solid transparent} .sw button.on{border-color:var(--fg)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace} .full{flex-basis:100%} .set{display:grid;grid-template-columns:28px 220px 1fr;gap:12px 10px;align-items:center;max-width:760px} label.ck{display:inline-flex;align-items:center;gap:4px;margin-right:10px}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:13px} .btn:hover:not(:disabled){background:var(--hover)} .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff} .btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)} .btn.danger{color:var(--bad)}
h2 .btn{margin-left:6px}
/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cardi{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:box-shadow .15s,border-color .15s;user-select:none;border-top:3px solid var(--c)}
.cardi:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)} .cardi.running{border-color:color-mix(in srgb,var(--c) 45%,var(--line));border-top-color:var(--c)}
.cardi.lift{position:fixed;z-index:50;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.22);transform:rotate(1.2deg) scale(1.02)} .cardi.ph{border:2px dashed var(--line);background:var(--card);box-shadow:none}
body.dragging{cursor:grabbing;user-select:none}
.ct{display:flex;align-items:center;gap:8px;min-width:0} .ct .no{font-weight:600;flex:none} .ct .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{position:relative;display:inline-flex;align-items:center;padding:4px;border-radius:6px;color:var(--sub);flex:none;outline:none} .fl .flag{width:24px;height:17px}
.fl .tip{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:#202124;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.6;cursor:default} .fl .tip b{font-size:13.5px;font-variant-numeric:tabular-nums}
.fl .tip .good{color:#81c995} .fl .tip .mid{color:#fdd663} .fl .tip .bad{color:#f28b82}
.fl:hover .tip,.fl:focus .tip{display:block}
.cs{display:flex;align-items:center;gap:5px;min-height:24px;flex-wrap:wrap} .cs .more{font-size:11.5px;color:var(--sub)}
.site{width:22px;height:22px;border-radius:7px;background:var(--bg);box-shadow:0 0 0 1px var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--sub)}
.cw{font-size:12px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cb{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin:0 -2px}
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)} .state i{width:7px;height:7px;border-radius:50%;background:#c4c7c5} .state.on i{background:var(--good)} .state.on{color:var(--fg)}
.cnt{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--sub);margin-right:4px;font-variant-numeric:tabular-nums} .cnt .ic+.ic,.cnt>.ic:nth-of-type(2){margin-left:6px}
.face{position:relative;width:28px;height:28px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.face.big{width:52px;height:52px;font-size:22px} .face .flag{position:absolute;right:-4px;bottom:-2px;width:15px;height:10.5px;box-shadow:0 0 0 1.5px var(--bg)} .face.big .flag{width:20px;height:14px}
.face .run{position:absolute;left:-2px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#c4c7c5;box-shadow:0 0 0 1.5px var(--bg)} .face .run.on{background:var(--good)}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);white-space:nowrap} .stb{width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden} .stb i{display:block;height:100%;background:var(--accent);transition:width .4s}
/* 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:flex;justify-content:flex-end;animation:fade .15s} .scrim.center{justify-content:center;align-items:center}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer{width:440px;max-width:100%;height:100%;overflow-y:auto;background:var(--bg);padding:18px 18px 30px;box-shadow:-10px 0 30px rgba(0,0,0,.15);animation:slide .18s}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:12px} .dh input.name{font-size:16px;font-weight:600;border-color:transparent;padding:4px 6px;margin-left:-6px;width:100%} .dh input.name:hover,.dh input.name:focus{border-color:var(--line)}
.drawer h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:20px 0 4px} .hint{margin-bottom:8px;line-height:1.5}
.acc{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)} .acc .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .acc .pw{font-family:ui-monospace,Consolas,monospace}
.acc.edit{flex-wrap:wrap} .acc.edit input{flex:1 1 120px;min-width:0}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--sub);margin-left:6px}
.cks{display:flex;flex-wrap:wrap;gap:6px} .ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 3px;font-size:12px} .ck b{font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.dz{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.modal{width:560px;max-width:calc(100% - 32px);background:var(--bg);border-radius:16px;padding:18px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fade .15s} .modal h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px}
</style></head><body><nav id="nav"></nav><main id="main"></main><script type="module" src="app.js"></script></body></html>
