<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
html{width:440px} body{max-height:590px;overflow-y:auto;overflow-x:hidden} ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px} ::-webkit-scrollbar-thumb:hover{background:var(--sub)}
header{padding:10px 12px 8px;display:flex;align-items:center;gap:8px} header .no{font-weight:600;font-size:15px}
.lat{font-variant-numeric:tabular-nums}
.exit{margin:0 12px 8px;padding:7px 10px;font-size:12px;display:grid;gap:3px;background:var(--card);border-radius:10px} .exit div{display:flex;align-items:center;gap:6px;min-width:0} .exit .k{flex:none;width:52px;color:var(--sub)} .exit .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>.hd select{max-width:170px;padding:3px 6px;font-size:12px}
.picks{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.combo{border:1px solid var(--line);border-radius:10px;background:var(--bg)} .combo.open{border-color:var(--inst,var(--accent))}
.cb{width:100%;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;text-align:left;min-height:34px} .cb:hover{background:var(--hover);border-radius:9px}
.cb .lb{flex:none;width:52px;color:var(--sub);font-size:12px} .cb .val{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden} .cb .val>span{overflow:hidden;text-overflow:ellipsis} .cb .val>.d,.cb .val>.flag{flex:none}
.cb .ic:last-child{color:var(--sub);transition:transform .15s} .combo.open .cb .ic:last-child{transform:rotate(180deg)}
.dd{max-height:264px;overflow-y:auto;border-top:1px solid var(--line);padding:2px 4px 4px;position:relative}
.gh{position:sticky;top:-2px;z-index:1;background:var(--bg);display:flex;align-items:center;gap:6px;padding:5px 6px 3px;font-size:11.5px;color:var(--sub)}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px;border-radius:7px;text-align:left;border-left:3px solid transparent}
.opt:hover{background:var(--hover)} .opt.on{background:var(--card);border-left-color:var(--inst,var(--accent))} .opt.dead .a{color:var(--sub)}
.opt .m{flex:1;min-width:0} .opt .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .opt .b{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num,.d{font-variant-numeric:tabular-nums} .d{flex:none;min-width:46px;text-align:right;font-size:12px}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:5px;color:var(--sub)}
form.add.in{margin:6px 2px 2px;flex-wrap:nowrap} form.add.in input{padding:4px 8px;font-size:12px;min-width:0}
.empty{padding:14px 6px;color:var(--sub);text-align:center}
form.add{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap} form.add input{flex:1;min-width:120px}
.fold{border-top:1px solid var(--line)} .fold>button{width:100%;display:flex;align-items:center;gap:6px;padding:8px 12px;color:var(--sub);font-size:12px;text-align:left} .fold>button:hover{color:var(--fg)}
.fold>button .ic:last-child{transition:transform .15s} .fold.open>button .ic:last-child{transform:rotate(180deg)} .fold>div{padding:0 12px 10px;display:grid;gap:8px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:7px 8px;align-items:center;font-size:12px} .kv>b{font-weight:400;color:var(--sub)} .kv select,.kv input{padding:4px 6px;font-size:12px;min-width:0;max-width:100%} .kv>select{width:100%}
.foot{border-top:1px solid var(--line);padding:6px 8px;display:flex;justify-content:space-around}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body><div id="root"></div><script type="module" src="popup.js"></script></body></html>
