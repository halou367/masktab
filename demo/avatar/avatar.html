<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>MaskTab · 头像即实例（演示）</title>
<style>
:root { --fg:#1f1f1f; --sub:#5f6368; --line:#e3e3e3; --menu:#fff; --hover:#f1f3f4; --accent:#0b57d0; --good:#188038; --mid:#b06000; --bad:#d93025; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.45 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--fg); background:#dfe3ea; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:28px 20px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
.ic { display:inline-flex; vertical-align:middle; }

/* ===== 模拟的浏览器窗口（主题色 = 实例颜色，和真实内核的 --install-autogenerated-theme 一致） ===== */
.win { width:1100px; max-width:100%; border-radius:10px; overflow:visible; box-shadow:0 18px 50px rgba(0,0,0,.25); background:#fff; position:relative; }
.tabs { height:42px; background:var(--frame); border-radius:10px 10px 0 0; display:flex; align-items:flex-end; padding:0 8px; gap:2px; transition:background .35s; position:relative; }
.tab { height:34px; width:220px; border-radius:9px 9px 0 0; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ontab); }
.tab.on { background:var(--bar); color:var(--fg); }
.tab .fav { width:16px; height:16px; }
.tab .fav svg { width:16px; height:16px; display:block; }
.wname { position:absolute; right:150px; top:10px; font-size:12px; color:var(--ontab); opacity:.85; }
.wctl { position:absolute; right:0; top:0; display:flex; }
.wctl span { width:46px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--ontab); }
.bar { height:46px; background:var(--bar); display:flex; align-items:center; gap:4px; padding:0 8px; transition:background .35s; border-bottom:1px solid rgba(0,0,0,.06); }
.tb { width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#444; flex:none; }
.tb:hover { background:rgba(0,0,0,.07); }
.omni { flex:1; height:34px; border-radius:99px; background:rgba(255,255,255,.85); display:flex; align-items:center; gap:8px; padding:0 14px; color:#333; margin:0 6px; }
.omni .u { flex:1; }
.sep { width:1px; height:20px; background:rgba(0,0,0,.15); margin:0 4px; }
.page { height:660px; background:#fff; border-radius:0 0 10px 10px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--sub); }
.page b { color:var(--fg); font-size:20px; font-weight:500; }

/* ===== 头像按钮：实例颜色圆 + 首字母 + 国旗角标 ===== */
.av { position:relative; width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:none; }
.av:hover, .av.open { background:rgba(0,0,0,.08); }
.face { width:26px; height:26px; border-radius:50%; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px; box-shadow:0 0 0 2px var(--bar); position:relative; }
.face.big { width:72px; height:72px; font-size:30px; box-shadow:0 0 0 4px #fff; }
.face .fl { position:absolute; right:-4px; bottom:-3px; width:14px; height:10px; border-radius:2px; box-shadow:0 0 0 1.5px var(--bar); object-fit:cover; }
.face.big .fl { width:26px; height:18px; right:-6px; bottom:-2px; box-shadow:0 0 0 2.5px #fff; border-radius:3px; }
.face .lt { position:absolute; left:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 1.5px var(--bar); }
/* 带名字的头像胶囊（Chromium 新版头像按钮也会显示名字，这里显示实例名） */
.pillav { display:flex; align-items:center; gap:7px; height:34px; padding:0 10px 0 4px; border-radius:99px; background:color-mix(in srgb,var(--c) 16%,transparent); color:var(--fg); }
.pillav:hover, .pillav.open { background:color-mix(in srgb,var(--c) 26%,transparent); }
.pillav .nm { max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px; font-weight:500; }

/* ===== 下拉菜单：照 Chromium 个人资料菜单的版式 ===== */
.menu { position:absolute; right:8px; top:86px; width:340px; background:var(--menu); border-radius:16px; box-shadow:0 4px 12px rgba(0,0,0,.12), 0 16px 40px rgba(0,0,0,.18); z-index:10; padding:10px 0 8px;
  opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top right; pointer-events:none; transition:opacity .14s, transform .16s cubic-bezier(.2,.8,.2,1); }
.menu.show { opacity:1; transform:none; pointer-events:auto; }
.hero { margin:0 10px 6px; border-radius:14px; background:color-mix(in srgb,var(--c) 14%,#fff); padding:18px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
.hero .t { font-size:15px; font-weight:600; margin-top:6px; }
.hero .s { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; }
.hero .chips { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
.chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 9px; border-radius:99px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.08); }
.hero .sites { display:flex; gap:5px; margin-top:6px; }
.site { width:24px; height:24px; border-radius:7px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.08); display:inline-flex; align-items:center; justify-content:center; }
.site svg { width:15px; height:15px; display:block; }
.hero .edit { position:absolute; right:8px; top:8px; }
.mi { display:flex; align-items:center; gap:14px; padding:0 20px; height:36px; width:100%; text-align:left; }
.mi:hover { background:var(--hover); }
.mi .ic { color:#444; }
.mi .k { margin-left:auto; color:var(--sub); font-size:11.5px; }
.hr { height:1px; background:var(--line); margin:6px 0; }
.lbl { font-size:11.5px; color:var(--sub); padding:4px 20px 2px; display:flex; align-items:center; }
.lbl .grow { flex:1; }
.inst { display:flex; align-items:center; gap:12px; padding:0 14px 0 18px; height:44px; width:100%; text-align:left; }
.inst:hover { background:var(--hover); }
.inst .face { box-shadow:none; }
.inst .face .fl { box-shadow:0 0 0 1.5px #fff; }
.inst .tx { flex:1; min-width:0; }
.inst .tx div:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.inst .tx .sub { font-size:11.5px; color:var(--sub); }
.inst .st { font-size:11px; color:var(--sub); display:flex; align-items:center; gap:4px; }
.inst .st i { width:7px; height:7px; border-radius:50%; background:#c4c7c5; display:inline-block; }
.inst .st.run i { background:var(--good); }
.search { margin:2px 14px 4px; display:flex; align-items:center; gap:6px; height:30px; border-radius:99px; background:var(--hover); padding:0 10px; }
.search input { border:0; outline:0; background:none; flex:1; font:inherit; }
.list { max-height:224px; overflow:auto; }
.list::-webkit-scrollbar { width:6px; } .list::-webkit-scrollbar-thumb { background:#d6d6d6; border-radius:6px; }

/* 切换时整窗闪一下实例色（真实实现是聚焦 / 拉起另一个窗口） */
.flash { position:absolute; inset:0; border-radius:10px; pointer-events:none; box-shadow:inset 0 0 0 0 var(--c); transition:box-shadow .5s; }
.flash.on { box-shadow:inset 0 0 0 4px var(--c); }
#toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); background:#323232; color:#fff; padding:8px 14px; border-radius:8px; opacity:0; transition:.2s; pointer-events:none; z-index:99; }
#toast.show { opacity:1; transform:translateX(-50%); }
.side { position:fixed; left:20px; bottom:20px; width:300px; background:#fff; border-radius:12px; padding:12px 14px; font-size:12px; color:var(--sub); box-shadow:0 6px 20px rgba(0,0,0,.12); }
.side b { color:var(--fg); }
.side label { display:flex; align-items:center; gap:6px; margin-top:6px; cursor:pointer; }
</style></head>
