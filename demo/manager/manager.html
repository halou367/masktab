<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>MaskTab · 实例管理（演示）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ===== 与 companion/ext/ui.css 一致的基础变量 ===== */
:root { --bg:#fff; --fg:#1f1f1f; --sub:#5f6368; --line:#e0e3e7; --card:#f6f8fa; --hover:#eef1f4; --accent:#1a73e8; --good:#188038; --mid:#b06000; --bad:#d93025; }
@media (prefers-color-scheme: dark) { :root { --bg:#202124; --fg:#e8eaed; --sub:#9aa0a6; --line:#3c4043; --card:#292a2d; --hover:#35363a; --accent:#8ab4f8; --good:#81c995; --mid:#fdd663; --bad:#f28b82; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
input, select, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; outline:none; }
input:focus, textarea:focus { border-color:var(--accent); }
.ic { display:inline-flex; vertical-align:middle; }
.ib { width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--sub); transition:background .12s; flex:none; }
.ib:hover { background:var(--hover); color:var(--fg); } .ib.on { color:var(--accent); } .ib.danger:hover { color:var(--bad); }
.sub { color:var(--sub); font-size:12px; } .grow { flex:1; min-width:0; }
.good { color:var(--good); } .mid { color:var(--mid); } .bad { color:var(--bad); }
.flag { width:22px; height:15px; border-radius:2px; object-fit:cover; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.12); display:block; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:9px; background:var(--accent); color:#fff; font-weight:500; }
.btn.ghost { background:none; color:var(--fg); border:1px solid var(--line); } .btn.ghost:hover { background:var(--hover); }
#toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%) translateY(20px); background:#323232; color:#fff; padding:8px 14px; border-radius:8px; opacity:0; transition:.2s; pointer-events:none; z-index:99; }
#toast.show { opacity:1; transform:translateX(-50%); }

/* ===== 布局 ===== */
body { display:flex; min-height:100vh; }
nav { width:64px; border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0; }
nav .ib { width:42px; height:42px; } nav .ib.on { background:var(--hover); }
main { flex:1; padding:20px 28px; max-width:1180px; }
h2 { font-size:18px; font-weight:500; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.toolbar { display:flex; align-items:center; gap:8px; margin:0 0 14px; }
.hint { font-size:12px; color:var(--sub); margin-bottom:14px; }

/* ===== 实例卡片 ===== */
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.card { position:relative; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:12px 12px 10px 16px; user-select:none; touch-action:none;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, opacity .18s; overflow:hidden; cursor:default; }
.card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); }
.card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
.card.pressing { transform:scale(.985); }
.card.lifted { z-index:20; box-shadow:0 14px 34px rgba(0,0,0,.22); transform:scale(1.03) rotate(-.6deg); transition:box-shadow .18s, transform .12s; cursor:grabbing; }
.card.ghost { opacity:.0; }
.ph { border:2px dashed var(--accent); border-radius:14px; background:color-mix(in srgb,var(--accent) 6%,transparent); }
.card .top { display:flex; align-items:center; gap:8px; }
.card .no { font-weight:600; font-size:13px; color:var(--sub); }
.card .nm { font-weight:500; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.card .st { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
.card .st.run { background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent); }
.flagwrap { position:relative; display:inline-flex; padding:3px; border-radius:5px; }
.flagwrap:hover { background:var(--hover); }
.sites { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 10px; min-height:30px; align-items:center; }
.site { width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; background:var(--bg); box-shadow:0 0 0 1px var(--line); position:relative; }
.site svg { width:18px; height:18px; display:block; }
.site .k { position:absolute; right:-3px; bottom:-3px; width:12px; height:12px; border-radius:50%; background:var(--good); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--card); }
.site .k svg { width:8px; height:8px; }
.site.cookie .k { background:var(--sub); }
.site.more { font-size:11px; color:var(--sub); }
.sites .none { font-size:12px; color:var(--sub); }
.card .bot { display:flex; align-items:center; gap:2px; border-top:1px solid var(--line); padding-top:6px; margin-top:2px; }
.card .bot .sub { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .grip { position:absolute; right:8px; top:8px; color:var(--sub); opacity:0; transition:opacity .15s; }
.card:hover .grip { opacity:.6; }

/* ===== 悬浮信息卡（国旗 / 站点） ===== */
#tip { position:fixed; z-index:60; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s; background:var(--bg); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.16); padding:10px 12px; font-size:12.5px; min-width:220px; max-width:320px; }
#tip.show { opacity:1; transform:none; }
#tip .r { display:grid; grid-template-columns:62px 1fr; gap:4px 8px; }
#tip .r b { font-weight:400; color:var(--sub); }
#tip .hd { display:flex; align-items:center; gap:8px; font-weight:500; margin-bottom:7px; }
.ty { display:inline-flex; font-size:11px; border-radius:6px; padding:0 6px; }
.ty.r { color:var(--good); background:color-mix(in srgb,var(--good) 13%,transparent); } .ty.d { color:var(--sub); background:color-mix(in srgb,var(--sub) 13%,transparent); }
.mono { font-family:ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; }

/* ===== 详情抽屉 ===== */
#mask { position:fixed; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
#mask.show { opacity:1; pointer-events:auto; }
#drawer { position:fixed; top:0; right:0; bottom:0; width:480px; max-width:100%; background:var(--bg); z-index:41; transform:translateX(102%); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  border-left:1px solid var(--line); display:flex; flex-direction:column; }
#drawer.show { transform:none; }
#drawer header { padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
#drawer header .bar { width:6px; align-self:stretch; border-radius:4px; }
#drawer .body { overflow:auto; padding:12px 18px 24px; flex:1; }
.sec h4 { font-size:12px; font-weight:500; color:var(--sub); margin:14px 0 8px; display:flex; align-items:center; gap:6px; }
.acct { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:11px; margin-bottom:7px; }
.acct .site { flex:none; }
.acct .u { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acct .pw { display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; } .acct .ib { width:28px; height:28px; }
.acct .pw span.mono { letter-spacing:1px; }
.tag { font-size:11px; border-radius:6px; padding:0 6px; border:1px solid var(--line); color:var(--sub); white-space:nowrap; }
.tag.on { color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,transparent); }
.ck { display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px dashed var(--line); font-size:12.5px; }
.ck:last-child { border-bottom:0; }
.tg { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); }
.tg i { width:28px; height:16px; border-radius:99px; background:var(--line); position:relative; transition:background .15s; flex:none; }
.tg i::after { content:''; position:absolute; left:2px; top:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
.tg.on { color:var(--fg); } .tg.on i { background:var(--accent); } .tg.on i::after { left:14px; }

/* ===== 弹窗（导入邮箱 / 模拟网站） ===== */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; z-index:50; pointer-events:none; opacity:0; transition:opacity .18s; }
.modal.show { opacity:1; pointer-events:auto; }
.modal .box { width:640px; max-width:calc(100% - 32px); max-height:calc(100% - 40px); overflow:auto; background:var(--bg); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:18px 20px; transform:translateY(10px) scale(.98); transition:transform .2s; }
.modal.show .box { transform:none; }
.modal h3 { margin:0 0 4px; font-size:16px; font-weight:500; display:flex; align-items:center; gap:8px; }
.field { display:flex; align-items:center; gap:8px; margin:12px 0; }
.field label { width:76px; color:var(--sub); font-size:12.5px; flex:none; }
textarea#emails { width:100%; min-height:150px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
.pv { margin-top:10px; border:1px solid var(--line); border-radius:10px; max-height:200px; overflow:auto; }
.pv .row { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line); font-size:12.5px; }
.pv .row:last-child { border-bottom:0; }
.pv .row .e { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.foot { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; align-items:center; }

/* 模拟网站窗口 */
.browser { width:520px; max-width:calc(100% - 32px); background:var(--bg); border-radius:12px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3); transform:translateY(10px); transition:transform .2s; }
.modal.show .browser { transform:none; }
.browser .chrome { background:var(--c); padding:8px 10px; display:flex; align-items:center; gap:8px; color:#fff; }
.browser .addr { flex:1; background:rgba(255,255,255,.92); color:#333; border-radius:99px; padding:4px 12px; font-size:12px; display:flex; align-items:center; gap:6px; }
.browser .page { padding:22px 40px 26px; position:relative; min-height:260px; }
.browser .page h1 { font-size:20px; font-weight:500; margin:6px 0 16px; text-align:center; }
.browser .page input { width:100%; margin-bottom:10px; padding:9px 10px; }
.browser .page input.filled { background:color-mix(in srgb,#fbbc04 18%,var(--bg)); transition:background .4s; }
.af { position:absolute; left:40px; right:40px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.16); overflow:hidden; z-index:2; }
.af .it { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; }
.af .it:hover { background:var(--hover); }
.af .ft { font-size:11.5px; color:var(--sub); padding:6px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:6px; }
.remind { margin-top:4px; border-radius:10px; padding:9px 11px; font-size:12.5px; display:flex; gap:8px; align-items:flex-start; background:color-mix(in srgb,var(--accent) 9%,transparent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); }

/* ===== 启动进度动画 ===== */
#boot { position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; align-items:center; justify-content:center; transition:opacity .45s, visibility .45s; }
#boot.done { opacity:0; visibility:hidden; }
#boot .wrap { width:440px; max-width:calc(100% - 40px); }
#boot .logo { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
#boot .logo .m { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#1a73e8,#7b61ff); display:flex; align-items:center; justify-content:center; color:#fff; position:relative; }
#boot .logo .m::after { content:''; position:absolute; inset:-5px; border-radius:18px; border:2px solid #1a73e8; opacity:.0; animation:pulse 1.6s infinite; }
@keyframes pulse { 0% { opacity:.55; transform:scale(.9); } 100% { opacity:0; transform:scale(1.25); } }
#boot .logo b { font-size:20px; font-weight:600; letter-spacing:.3px; }
.step { display:flex; align-items:center; gap:12px; padding:9px 0; opacity:.38; transition:opacity .25s; }
.step.act, .step.ok, .step.warn { opacity:1; }
.step .ind { width:22px; height:22px; flex:none; position:relative; display:flex; align-items:center; justify-content:center; }
.step .ind .sp { width:18px; height:18px; border-radius:50%; border:2.2px solid var(--line); }
.step.act .ind .sp { border-color:var(--accent) transparent var(--accent) transparent; animation:spin .8s linear infinite; }
.step.ok .ind .sp, .step.warn .ind .sp { display:none; }
.step .ind .okm { display:none; color:#fff; width:20px; height:20px; border-radius:50%; background:var(--good); align-items:center; justify-content:center; animation:pop .3s cubic-bezier(.2,1.6,.4,1); }
.step.ok .ind .okm { display:flex; } .step.warn .ind .okm { display:flex; background:var(--mid); }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pop { from { transform:scale(.3); } to { transform:scale(1); } }
.step .tx { flex:1; min-width:0; } .step .tx div:first-child { font-size:13.5px; } .step .tx .sub { min-height:16px; }
.step .viz { width:120px; display:flex; justify-content:flex-end; }
/* 网络连通动画：本机 → 网卡 → 互联网，数据点流动 */
.net { display:flex; align-items:center; gap:0; }
.net .nd { width:20px; height:20px; border-radius:6px; border:1.6px solid var(--sub); display:flex; align-items:center; justify-content:center; color:var(--sub); background:var(--bg); z-index:1; }
.net .ln { width:30px; height:2px; background:var(--line); position:relative; overflow:hidden; }
.net .ln::after { content:''; position:absolute; top:-1px; left:-8px; width:8px; height:4px; border-radius:2px; background:var(--accent); animation:flow 0.9s linear infinite; }
.net .ln.l2::after { animation-delay:.45s; }
.step.ok .net .ln::after { animation:none; left:0; width:100%; background:var(--good); }
.step.ok .net .nd { border-color:var(--good); color:var(--good); }
@keyframes flow { to { left:100%; } }
.bars { display:flex; gap:3px; align-items:flex-end; height:18px; }
.bars i { width:4px; border-radius:2px; background:var(--accent); animation:eq 1s ease-in-out infinite; }
.bars i:nth-child(2){animation-delay:.15s} .bars i:nth-child(3){animation-delay:.3s} .bars i:nth-child(4){animation-delay:.45s} .bars i:nth-child(5){animation-delay:.6s}
.step.ok .bars i { animation:none; background:var(--good); }
@keyframes eq { 0%,100% { height:4px; } 50% { height:18px; } }
.prog { height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:16px; }
.prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,#1a73e8,#7b61ff); transition:width .4s; }
#boot .skip { margin-top:12px; font-size:12px; color:var(--sub); text-align:right; }
#boot .skip button { color:var(--accent); }
.shield { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--good); background:color-mix(in srgb,var(--good) 12%,transparent); padding:1px 7px; border-radius:99px; }
</style></head>
<body>
<nav id="nav"></nav>
<main>
  <h2><span id="hIcon"></span>实例 <span class="shield" id="shield" title="浏览器流量只走 MaskTab 自己的代理内核，并绑定物理网卡：不受本机 TUN、系统代理、环境变量影响"></span><span class="grow"></span></h2>
  <div class="hint">长按卡片拖动可调整顺序 · 鼠标移到国旗上看出口 IP · 网站图标是这个实例记住的账号，点卡片看详情</div>
  <div class="toolbar">
    <button class="btn" id="bNew"></button>
    <button class="btn ghost" id="bImport"></button>
    <span class="grow"></span>
    <button class="btn ghost" id="bReboot" title="重新播放启动动画"></button>
  </div>
  <div id="grid"></div>
</main>
<div id="tip"></div>
<div id="mask"></div>
<aside id="drawer"></aside>
<div class="modal" id="mImport"></div>
<div class="modal" id="mSite"></div>
<div id="boot"></div>
<div id="toast"></div>

<script>

const PALETTE = ['#1a73e8', '#d93025', '#188038', '#f9ab00', '#9334e6', '#e8710a', '#12b5cb', '#e52592'];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv) : (el.style[sk] = sv); }
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); }
  return el;
}

let drag = null, justDragged = false;
function attachDrag(el) {
  el.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || ev.target.closest('button,.flagwrap')) return;
    const sx = ev.clientX, sy = ev.clientY;
    el.classList.add('pressing');
    const timer = setTimeout(() => startDrag(el, ev.pointerId, sx, sy), 350);
    const cancel = (e2) => { if (e2.type === 'pointermove' && Math.hypot(e2.clientX - sx, e2.clientY - sy) < 6) return; clearTimeout(timer); el.classList.remove('pressing'); off(); };
    const off = () => { removeEventListener('pointermove', cancel); removeEventListener('pointerup', cancel); };
    addEventListener('pointermove', cancel); addEventListener('pointerup', cancel);
  });
}
function startDrag(el, pid, sx, sy) {
  hideTip();

  const ph = h('div', { class: 'ph', style: { height: r.height + 'px' } });
  el.after(ph);
  el.classList.remove('pressing'); el.classList.add('lifted');
  Object.assign(el.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0 });
  document.body.append(el);
  drag = { el, ph, dx: sx - r.left, dy: sy - r.top };
  if (navigator.vibrate) navigator.vibrate(15);
  const move = (e) => {
    el.style.left = e.clientX - drag.dx + 'px'; el.style.top = e.clientY - drag.dy + 'px';
    const cards = [...grid.querySelectorAll('.card')];
    // 找离指针最近的卡片，按左右半边决定插到它前面还是后面（FLIP 动画让其它卡片平滑让位）
    let best = null, bd = 1e9;
    for (const c of cards) { const b = c.getBoundingClientRect(); const d = Math.hypot(e.clientX - (b.left + b.width / 2), e.clientY - (b.top + b.height / 2)); if (d < bd) { bd = d; best = c; } }
    if (!best) return;
    const b = best.getBoundingClientRect();
    const before = e.clientX < b.left + b.width / 2;
    const target = before ? best : best.nextSibling;
    if (target === ph || (before ? best.previousSibling === ph : best.nextSibling === ph)) return;
    const first = new Map(cards.map((c) => [c, c.getBoundingClientRect()]));
    grid.insertBefore(ph, target);
    for (const c of cards) { const a = first.get(c), z = c.getBoundingClientRect(); const dx = a.left - z.left, dy = a.top - z.top; if (dx || dy) { c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`; requestAnimationFrame(() => { c.style.transition = ''; c.style.transform = ''; }); } }
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    const pr = ph.getBoundingClientRect();
    el.style.transition = 'left .18s, top .18s, transform .18s, box-shadow .18s';
    el.style.left = pr.left + 'px'; el.style.top = pr.top + 'px'; el.classList.remove('lifted');
    setTimeout(() => {
      ph.replaceWith(el); el.removeAttribute('style'); el.style.setProperty('--c', state.instances.find((x) => x.id === el.dataset.id).color);
      const ids = [...grid.querySelectorAll('.card')].map((c) => c.dataset.id);
      state.instances.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)); save();
      drag = null; justDragged = true; setTimeout(() => (justDragged = false), 50);
      toast('顺序已保存');
    }, 190);
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

const mImport = document.getElementById('mImport');
function parseEmails(text, def) {
  const seen = new Set(state.instances.map((i) => i.name.toLowerCase()));
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith('#')) continue;
    // 支持：邮箱 / 邮箱----密码 / 邮箱:密码 / 邮箱|密码 / 邮箱,密码 / 邮箱<空格或Tab>密码
    const m = /^([^\s,|:;]+@[^\s,|:;]+\.[a-z]{2,})(?:\s*(?:-{2,}|[,|:;\t ])\s*(.+))?$/i.exec(line);
    if (!m) { out.push({ raw: line, err: '不是邮箱' }); continue; }
    const email = m[1].toLowerCase(), pw = (m[2] || '').trim();
    if (seen.has(email)) { out.push({ raw: line, email, err: '已存在' }); continue; }
    seen.add(email);
    out.push({ email, pw: pw || def, own: !!pw });
  }
  return out;
}

function netViz() { return h('div', { class: 'net' }, h('span', { class: 'nd' }, icon('pc', 12)), h('span', { class: 'ln' }), h('span', { class: 'nd' }, icon('nic', 12)), h('span', { class: 'ln l2' }), h('span', { class: 'nd' }, icon('globe', 12))); }

const STEPS = [
